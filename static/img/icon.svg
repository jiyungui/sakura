<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景轻微陶瓷白渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF7F8" />
    </linearGradient>

    <!-- 樱花花瓣温柔粉色微渐变 -->
    <linearGradient id="petalStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758F" />
      <stop offset="100%" stop-color="#FF9EAA" />
    </linearGradient>

    <!-- 柔和粉晕光泽阴影 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF758F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 1. 圆润纯白应用背景底板 (iOS App Icon 标准 512x512 圆角) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 2. 外层极细微粉白质感边框 -->
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#FFE3E8" stroke-width="2" />

  <!-- 3. 樱花主体（以 (256, 236) 为中心排布 5 片月牙花瓣） -->
  <g filter="url(#softGlow)" stroke="url(#petalStroke)" stroke-width="16" stroke-linecap="round" fill="none">
    <!-- 顶部花瓣 0° -->
    <g transform="translate(256, 236)">
      <!-- 0度: 正上方 -->
      <path d="M -38 -15 C -45 -95, 45 -95, 38 -15 C 22 -65, -22 -65, -38 -15 Z" fill="#FFF0F3" />
      
      <!-- 72度: 右上方 -->
      <g transform="rotate(72)">
        <path d="M -38 -15 C -45 -95, 45 -95, 38 -15 C 22 -65, -22 -65, -38 -15 Z" fill="#FFF0F3" />
      </g>
      
      <!-- 144度: 右下方 -->
      <g transform="rotate(144)">
        <path d="M -38 -15 C -45 -95, 45 -95, 38 -15 C 22 -65, -22 -65, -38 -15 Z" fill="#FFF0F3" />
      </g>
      
      <!-- 216度: 左下方 -->
      <g transform="rotate(216)">
        <path d="M -38 -15 C -45 -95, 45 -95, 38 -15 C 22 -65, -22 -65, -38 -15 Z" fill="#FFF0F3" />
      </g>
      
      <!-- 288度: 左上方 -->
      <g transform="rotate(288)">
        <path d="M -38 -15 C -45 -95, 45 -95, 38 -15 C 22 -65, -22 -65, -38 -15 Z" fill="#FFF0F3" />
      </g>
    </g>
  </g>

  <!-- 4. 樱花花芯萌系核心：表情 (T v T) 与 腮红 -->
  <g id="kawaiiFace" transform="translate(256, 236)">
    <!-- 萌萌小腮红 -->
    <ellipse cx="-42" cy="6" rx="10" ry="6" fill="#FFCCD5" />
    <ellipse cx="42" cy="6" rx="10" ry="6" fill="#FFCCD5" />

    <!-- 哭唧唧萌萌眼 (左 T) -->
    <path d="M -36 -12 L -20 -12" stroke="#FF5C8A" stroke-width="5" stroke-linecap="round" />
    <path d="M -28 -12 L -28 6" stroke="#FF5C8A" stroke-width="5" stroke-linecap="round" />

    <!-- 哭唧唧萌萌眼 (右 T) -->
    <path d="M 20 -12 L 36 -12" stroke="#FF5C8A" stroke-width="5" stroke-linecap="round" />
    <path d="M 28 -12 L 28 6" stroke="#FF5C8A" stroke-width="5" stroke-linecap="round" />

    <!-- 萌系小嘴 (v) -->
    <path d="M -7 -1 Q 0 8 7 -1" fill="none" stroke="#FF5C8A" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- 晶莹萌系泪滴光点 (点缀于 TvT 眼角) -->
    <circle cx="-16" cy="10" r="3" fill="#A0E9FF" opacity="0.85" />
    <circle cx="40" cy="10" r="3" fill="#A0E9FF" opacity="0.85" />
  </g>

  <!-- 5. 底部精致副标文字：SAKURA TVT (极简杂志风排版) -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" 
        font-size="24" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#FF758F">SAKURA TVT</text>
</svg>
